<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodEx2 Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #fafafa;
    --sidebar-bg: #fff;
    --sidebar-border: #e2e2e2;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --code-bg: #f1f5f9;
    --code-border: #e2e8f0;
    --table-border: #d1d5db;
    --table-stripe: #f9fafb;
    --badge-bg: #e0e7ff;
    --badge-text: #3730a3;
    --meta-bg: #f8fafc;
    --meta-border: #e2e8f0;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  aside {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .sidebar-header p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .find-panel {
    padding: 12px 16px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  .find-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .find-input {
    width: 100%;
    border: 1px solid var(--sidebar-border);
    border-radius: var(--radius);
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--sidebar-bg);
  }

  .find-input:focus {
    outline: 2px solid var(--badge-bg);
    border-color: var(--accent);
  }

  .find-status {
    min-height: 18px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .find-results {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
  }

  .find-result {
    width: 100%;
    border: 1px solid var(--sidebar-border);
    border-radius: var(--radius);
    padding: 8px;
    background: var(--sidebar-bg);
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .find-result:hover { border-color: var(--accent); background: var(--table-stripe); }

  .find-result-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .find-result-meta {
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .find-snippet {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--text-muted);
  }

  .nav-section {
    padding: 12px 16px 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  nav {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 20px;
  }

  nav a {
    display: block;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }

  nav a:hover { background: var(--table-stripe); }
  nav a.active {
    background: var(--badge-bg);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 900px;
  }

  .meta-bar {
    background: var(--meta-bg);
    border: 1px solid var(--meta-border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .meta-bar .label { font-weight: 600; color: var(--text); }

  .related-links { display: flex; flex-wrap: wrap; gap: 6px; }

  .related-link {
    display: inline-block;
    padding: 2px 8px;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s;
  }

  .related-link:hover { background: #c7d2fe; }

  .content h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.02em; }
  .content h2 { font-size: 20px; font-weight: 600; margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--sidebar-border); }
  .content h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
  .content p { line-height: 1.7; margin-bottom: 12px; }
  .content ul, .content ol { margin: 8px 0 16px 20px; line-height: 1.7; }
  .content li { margin-bottom: 6px; }
  .content li ul { margin-top: 4px; margin-bottom: 4px; }

  .content code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  }

  .content pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    overflow-x: auto;
    margin: 12px 0 16px;
  }

  .content pre code {
    border: none;
    padding: 0;
    background: none;
    font-size: 13px;
  }

  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0 20px;
    font-size: 14px;
  }

  .content th, .content td {
    border: 1px solid var(--table-border);
    padding: 8px 12px;
    text-align: left;
  }

  .content th {
    background: var(--table-stripe);
    font-weight: 600;
  }

  .content tr:nth-child(even) { background: var(--table-stripe); }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (max-width: 768px) {
    aside { width: 220px; min-width: 220px; }
    main { padding: 20px 24px; }
  }
</style>
</head>
<body>

<aside>
  <div class="sidebar-header">
    <h1>FoodEx2 Wiki</h1>
    <p>Knowledge base viewer</p>
  </div>
  <div class="find-panel">
    <label class="find-label" for="find-input">Find</label>
    <input id="find-input" class="find-input" type="search" placeholder="F09 or exact phrase">
    <div id="find-status" class="find-status"></div>
    <div id="find-results" class="find-results"></div>
  </div>
  <nav id="nav"></nav>
</aside>

<main>
  <div id="meta" class="meta-bar" style="display:none"></div>
  <div id="content" class="content">
    <div class="loading">Loading wiki&hellip;</div>
  </div>
</main>

<script>
const categoryLabels = {
  orientation: "Orientation",
  runtime: "Runtime",
  guidance: "Guidance",
  domain_overlay: "Domain Overlays",
  validation: "Validation",
  maintenance: "Maintenance",
  unknown: "Other"
};

const categoryOrder = ["orientation", "runtime", "guidance", "domain_overlay", "validation", "maintenance", "unknown"];

const builtInPages = [
  { page_name: "index.md", title: "Wiki Index", category: "orientation" },
  { page_name: "log.md", title: "Wiki Log", category: "maintenance" }
];

const preferredOrder = [
  "index.md", "README.md", "PROJECT_CONTEXT.md", "KNOWLEDGE_ARCHITECTURE.md",
  "INGEST_WORKFLOW.md", "MAINTENANCE_WORKFLOW.md", "SCHEMA.md",
  "RUNTIME_RULES.md", "policy-contract.md", "foodex2-overview.md",
  "base-term-selection.md", "facet-coding-rules.md", "implicit-vs-explicit-facets.md",
  "code-string-format.md", "process-facets.md", "ingredient-facets.md",
  "packaging-facets.md", "chemical-monitoring-foodex2.md",
  "pesticides-foodex2.md", "contaminants-foodex2.md", "domoic-acid-scallops.md",
  "vmpr-foodex2.md", "vmpr-legislative-mapping.md",
  "additives-flavourings-foodex2.md", "business-rules.md",
  "validation-rules.md", "structural-validation.md",
  "term-type-facet-constraints.md", "process-validation-rules.md",
  "domain-specific-validation.md", "maintenance-history.md"
];

let pageCache = {};
let pageTitles = {};
let navPages = [];
let findTimer = null;
let activeFindQuery = "";

function sanitize(html) {
  return DOMPurify.sanitize(html, { ADD_ATTR: ['onclick'] });
}

async function init() {
  try {
    const res = await fetch("/wiki/pages");
    const data = await res.json();
    navPages = normalizePageList(data.pages || []);
    for (const p of navPages) {
      pageTitles[p.page_name] = p.title;
    }
  } catch(e) {
    console.warn("Could not fetch page list", e);
    navPages = normalizePageList([]);
  }
  setupFind();
  buildNav(navPages);
  const hash = location.hash.replace("#", "");
  loadPage(hash || "index.md");
}

function normalizePageList(apiPages) {
  const pagesByName = new Map();
  for (const page of builtInPages) {
    pagesByName.set(page.page_name, page);
  }
  for (const page of apiPages) {
    const category = categoryLabels[page.category] ? page.category : "unknown";
    pagesByName.set(page.page_name, {
      page_name: page.page_name,
      title: page.title || page.page_name,
      category
    });
  }
  return Array.from(pagesByName.values()).sort(comparePages);
}

function comparePages(a, b) {
  const categoryDelta = categoryOrder.indexOf(a.category) - categoryOrder.indexOf(b.category);
  if (categoryDelta !== 0) return categoryDelta;

  const aPreferred = preferredOrder.indexOf(a.page_name);
  const bPreferred = preferredOrder.indexOf(b.page_name);
  if (aPreferred !== -1 || bPreferred !== -1) {
    if (aPreferred === -1) return 1;
    if (bPreferred === -1) return -1;
    return aPreferred - bPreferred;
  }

  return a.page_name.localeCompare(b.page_name);
}

function buildNav(pages) {
  const nav = document.getElementById("nav");
  while (nav.firstChild) nav.removeChild(nav.firstChild);
  for (const category of categoryOrder) {
    const sectionPages = pages.filter(function(page) { return page.category === category; });
    if (sectionPages.length === 0) continue;

    const header = document.createElement("div");
    header.className = "nav-section";
    header.textContent = categoryLabels[category] || category;
    nav.appendChild(header);
    for (const page of sectionPages) {
      const a = document.createElement("a");
      a.href = "#" + page.page_name;
      a.textContent = page.title || page.page_name.replace(".md", "").replace(/-/g, " ");
      a.dataset.page = page.page_name;
      a.addEventListener("click", function(e) {
        e.preventDefault();
        loadPage(this.dataset.page);
      });
      nav.appendChild(a);
    }
  }
}

function setupFind() {
  const input = document.getElementById("find-input");
  input.addEventListener("input", function() {
    if (findTimer) clearTimeout(findTimer);
    findTimer = setTimeout(runFind, 180);
  });
  input.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      input.value = "";
      clearFindResults();
    }
    if (e.key === "Enter") {
      if (findTimer) clearTimeout(findTimer);
      runFind();
    }
  });
}

function clearFindResults() {
  activeFindQuery = "";
  document.getElementById("find-status").textContent = "";
  document.getElementById("find-results").textContent = "";
}

async function runFind() {
  const input = document.getElementById("find-input");
  const query = input.value.trim();
  activeFindQuery = query;
  if (!query) {
    clearFindResults();
    return;
  }
  if (query.length < 2) {
    document.getElementById("find-status").textContent = "";
    document.getElementById("find-results").textContent = "";
    return;
  }

  const status = document.getElementById("find-status");
  const results = document.getElementById("find-results");
  status.textContent = "Finding...";
  results.textContent = "";

  try {
    const res = await fetch("/wiki/search?q=" + encodeURIComponent(query) + "&limit=12");
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    if (activeFindQuery !== query) return;
    renderFindResults(data);
  } catch(e) {
    if (activeFindQuery !== query) return;
    status.textContent = "Find failed";
  }
}

function renderFindResults(data) {
  const status = document.getElementById("find-status");
  const results = document.getElementById("find-results");
  results.textContent = "";

  if (!data.results || data.results.length === 0) {
    status.textContent = "No matches";
    return;
  }

  const shown = data.results.length;
  status.textContent = data.result_count > shown
    ? "Showing " + shown + " of " + data.result_count + " matches"
    : data.result_count + " match" + (data.result_count === 1 ? "" : "es");

  for (const result of data.results) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "find-result";
    button.addEventListener("click", function() {
      loadPage(result.page_name);
    });

    const title = document.createElement("div");
    title.className = "find-result-title";
    title.textContent = result.title || result.page_name;
    button.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "find-result-meta";
    meta.textContent = (categoryLabels[result.category] || result.category || "Other")
      + " · " + result.page_name;
    button.appendChild(meta);

    for (const snippetText of (result.snippets || []).slice(0, 2)) {
      const snippet = document.createElement("div");
      snippet.className = "find-snippet";
      snippet.textContent = snippetText;
      button.appendChild(snippet);
    }

    results.appendChild(button);
  }
}

async function loadPage(pageName) {
  location.hash = pageName;
  document.querySelectorAll("nav a").forEach(function(a) {
    a.classList.toggle("active", a.dataset.page === pageName);
  });

  const contentEl = document.getElementById("content");
  const metaEl = document.getElementById("meta");

  if (pageCache[pageName]) {
    renderPage(pageCache[pageName]);
    return;
  }

  contentEl.textContent = "";
  const loadingDiv = document.createElement("div");
  loadingDiv.className = "loading";
  loadingDiv.textContent = "Loading\u2026";
  contentEl.appendChild(loadingDiv);
  metaEl.style.display = "none";

  try {
    const res = await fetch("/wiki/pages/" + encodeURIComponent(pageName));
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    pageCache[pageName] = data;
    renderPage(data);
  } catch(e) {
    contentEl.textContent = "Failed to load " + pageName + ": " + e.message;
  }
}

function renderPage(data) {
  const contentEl = document.getElementById("content");
  const metaEl = document.getElementById("meta");

  let md = data.content || "";
  // strip YAML frontmatter
  if (md.startsWith("---")) {
    const end = md.indexOf("---", 3);
    if (end > 0) md = md.substring(end + 3).trim();
  }
  // strip HTML comments
  md = md.replace(/<!--[\s\S]*?-->/g, "");

  const rendered = sanitize(marked.parse(md));
  contentEl.textContent = "";
  const wrapper = document.createElement("div");
  wrapper.innerHTML = rendered;
  contentEl.appendChild(wrapper);

  // make wiki links clickable
  contentEl.querySelectorAll("a").forEach(function(a) {
    const href = a.getAttribute("href") || "";
    if (href.startsWith("raw/efsa-guidance/") || href.endsWith(".md")) {
      const target = href.split("/").pop();
      a.href = "#" + target;
      a.addEventListener("click", function(e) {
        e.preventDefault();
        loadPage(target);
      });
    }
  });

  // build meta bar
  const hasSources = data.sources && data.sources.length > 0;
  const hasRelated = data.related && data.related.length > 0;

  if (hasSources || hasRelated) {
    while (metaEl.firstChild) metaEl.removeChild(metaEl.firstChild);

    if (hasSources) {
      const srcDiv = document.createElement("div");
      const srcLabel = document.createElement("span");
      srcLabel.className = "label";
      srcLabel.textContent = "Sources: ";
      srcDiv.appendChild(srcLabel);
      srcDiv.appendChild(document.createTextNode(data.sources.join("; ")));
      metaEl.appendChild(srcDiv);
    }

    if (hasRelated) {
      const relDiv = document.createElement("div");
      const relLabel = document.createElement("span");
      relLabel.className = "label";
      relLabel.textContent = "Related: ";
      relDiv.appendChild(relLabel);

      const linksDiv = document.createElement("div");
      linksDiv.className = "related-links";
      data.related.forEach(function(r) {
        const target = r.replace(/\[\[|\]\]/g, "").split("|", 1)[0].split("#", 1)[0];
        const name = target.endsWith(".md") ? target : target + ".md";
        const title = pageTitles[name] || name.replace(".md", "").replace(/-/g, " ");
        const span = document.createElement("span");
        span.className = "related-link";
        span.textContent = title;
        span.addEventListener("click", function() { loadPage(name); });
        linksDiv.appendChild(span);
      });
      relDiv.appendChild(linksDiv);
      metaEl.appendChild(relDiv);
    }

    metaEl.style.display = "flex";
  } else {
    metaEl.style.display = "none";
  }

  document.querySelector("main").scrollTop = 0;
}

window.addEventListener("hashchange", function() {
  const page = location.hash.replace("#", "");
  if (page) loadPage(page);
});

init();
</script>
</body>
</html>
