name: Source Coverage (non-blocking)

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 0"

jobs:
  mechanical-index:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install PyYAML
      - name: Build source-to-test coverage map (zero model calls)
        run: >-
          python evals/coverage/coverage_index.py
          --output evals/coverage/reports/coverage-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-coverage-index
          path: evals/coverage/reports/coverage-index.json
